<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Slayer Terminal">
  <!--
    The brand mark reduced to the two glyphs that survive at 16px: the prompt
    chevron and the cursor block. Same holographic silver as .holo-text, frozen
    at one angle — a favicon cannot animate, and the gradient is what makes the
    mark read as this product rather than a generic terminal icon.
  -->
  <defs>
    <linearGradient id="holo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#aeb9cf"/>
      <stop offset="14%"  stop-color="#eef1f8"/>
      <stop offset="30%"  stop-color="#a8c4e8"/>
      <stop offset="45%"  stop-color="#d6c6ee"/>
      <stop offset="58%"  stop-color="#f7f8fc"/>
      <stop offset="72%"  stop-color="#b2c8e2"/>
      <stop offset="86%"  stop-color="#e2d4ee"/>
      <stop offset="100%" stop-color="#aeb9cf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <path d="M15 20 L28 32 L15 44" fill="none" stroke="url(#holo)" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="20" width="9" height="24" rx="1.5" fill="url(#holo)"/>
</svg>
