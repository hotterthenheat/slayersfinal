name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a literal, so the version that decides CI is the
      # same one `nvm use` reads.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # NO LINT AND NO TEST STEP, deliberately, because there is nothing to run:
      # this codebase ships no ESLint config and no test files, so `npm run lint`
      # and `npm test` are both "Missing script" and would fail the job on every
      # push without telling anyone anything about the code.
      #
      # That makes this gate typecheck + build and nothing else. It cannot catch
      # a wrong number, a mislabelled figure, or a regression in behaviour — only
      # code that does not compile. The three scripts under scripts/ are real
      # assertions (fixture arithmetic, replay determinism, the query parser) and
      # are NOT wired in here because they are not npm scripts; wiring them up is
      # the cheapest way to get this gate back to meaning something.

      - name: Build
        run: npm run build
