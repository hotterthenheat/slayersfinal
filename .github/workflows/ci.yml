name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    # 75, and the history of this number is the reason for the headroom.
    #
    # It was 15 until the job crossed it on 4da6245, then 25. On the v2
    # directive's Terrain work the sweep gained sections for six features and
    # the run came in at 24m31s and 24m46s — inside 25 by about twenty
    # seconds, which is not inside it at all: the next section, or one slow
    # runner, tips it over. And a tipped-over job does not read as one.
    # GitHub reports a timed-out job as CANCELLED, not failed, so it looks
    # like somebody stopped the run rather than like the budget being wrong —
    # which is exactly how the last two overruns were misread.
    #
    # AND IT HAPPENED AGAIN, THE SAME WAY, AT 40 (2026-09-04). The paragraph
    # above was written when 25 was raised to 40 and it described this exact
    # failure in advance; it still did not stop anyone — me included — from
    # reading the next two overruns as somebody cancelling a run:
    #
    #   run 912  Aug 30                35m21s  success
    #   run 922  Aug 30                36m14s  success
    #   run 941  Aug 30                38m53s  success
    #   run 945  #82 merged to main    39m52s  CANCELLED — timeout
    #   run 948  #83 merged to main    40m38s  CANCELLED — timeout
    #   run 958  this branch           40m13s  CANCELLED — timeout, and the
    #                                          sweep step alone had run 32m55s
    #                                          without reaching its end
    #
    # So two merges landed on main against a job that never finished, and
    # nothing said so. 38m53s passing and 39m52s timing out is not a budget
    # with headroom, it is a coin toss that had been coming up heads.
    #
    # 75 is not "40 plus a bit". The pre-sweep steps (install, typecheck,
    # test, build, chromium) measure ~7m18s, so this leaves the sweep about
    # 68 minutes against a need somewhere past 33 — roughly double, which is
    # the point. Set it well clear of the measurement rather than just above
    # it, so that growing the coverage by one section is a normal thing to do
    # and not a thing that silently stops CI from reporting.
    #
    # The sweep is the long pole by design (see the note on the step below);
    # the budget follows the coverage, never the other way round.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a literal, so the version that decides CI is the
      # same one `nvm use` reads.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # There is still NO LINT STEP: this codebase ships no ESLint config, so
      # `npm run lint` is "Missing script" and would fail every push without
      # saying anything about the code.
      #
      # `npm test` runs the three assertion scripts under scripts/ — the
      # partner spec's worked fixtures, replay determinism under a pinned
      # clock, and the Weigher's order-free query parser. The uploaded tree
      # ships those three files but did not wire a `test` script, so CI called
      # a script that did not exist; this restores the call.

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The browser sweep drives the built desk and the Pinpoint desks in a
      # real Chromium: geometry at eight widths x four layouts, the strike rail
      # against the chart's own price scale, the crosshair crossing panes, the
      # two storage migrations, and — since the Pinpoint audit — menu
      # placement, sub-tab overflow, explainer clicks and read-outs against the
      # bars they point at.
      #
      # It is the long pole in this job and it is meant to be: every section
      # opens its own browser context and waits out the launch splash, which is
      # what makes the measurements real rather than optimistic. Budget for it
      # in `timeout-minutes` above rather than trimming coverage to fit.
      #
      # `chromium` and NOT `chromium-headless-shell`: under the shell,
      # lightweight-charts never sizes its canvas bitmaps, so every geometry
      # assertion passes and the "nothing in the price gutter" assertion passes
      # BECAUSE THE GUTTER IS EMPTY. The sweep refuses to run rather than
      # report green for that reason, so installing the wrong build fails the
      # job loudly instead of quietly.
      - name: Install Chromium for the sweep
        run: npx playwright install --with-deps chromium

      - name: UI sweep
        run: npm run test:ui
