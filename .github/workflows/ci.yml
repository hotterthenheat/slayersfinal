name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a literal, so the version that decides CI is the
      # same one `nvm use` reads.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # There is still NO LINT STEP: this codebase ships no ESLint config, so
      # `npm run lint` is "Missing script" and would fail every push without
      # saying anything about the code.
      #
      # There IS a test step now. `npm test` runs the four assertion scripts
      # under scripts/ — 43 assertions covering the partner spec's worked
      # fixtures, replay determinism under a pinned clock, the Weigher query
      # parser, and the scoring-weight tables. They existed before and nothing
      # ran them.
      #
      # Every one of the weights-proof assertions is mutation-verified: dropping
      # a factor without re-normalising fails it, restoring the news sleeve
      # fails it, and re-importing the news generator anywhere in src fails it.

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
