name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    # 25, not 15. The sweep has grown from four sections to a dozen and the
    # job crossed 15 minutes on 4da6245 — GitHub reports a timed-out job as
    # CANCELLED, not failed, so two runs looked like someone had stopped them
    # rather than like the budget being the problem. Raised with headroom
    # instead of to the exact figure, because the number that matters is the
    # one a slow runner needs, not the one a fast runner used.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a literal, so the version that decides CI is the
      # same one `nvm use` reads.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # There is still NO LINT STEP: this codebase ships no ESLint config, so
      # `npm run lint` is "Missing script" and would fail every push without
      # saying anything about the code.
      #
      # `npm test` runs the three assertion scripts under scripts/ — the
      # partner spec's worked fixtures, replay determinism under a pinned
      # clock, and the Weigher's order-free query parser. The uploaded tree
      # ships those three files but did not wire a `test` script, so CI called
      # a script that did not exist; this restores the call.

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The browser sweep drives the built desk and the Pinpoint desks in a
      # real Chromium: geometry at eight widths x four layouts, the strike rail
      # against the chart's own price scale, the crosshair crossing panes, the
      # two storage migrations, and — since the Pinpoint audit — menu
      # placement, sub-tab overflow, explainer clicks and read-outs against the
      # bars they point at.
      #
      # It is the long pole in this job and it is meant to be: every section
      # opens its own browser context and waits out the launch splash, which is
      # what makes the measurements real rather than optimistic. Budget for it
      # in `timeout-minutes` above rather than trimming coverage to fit.
      #
      # `chromium` and NOT `chromium-headless-shell`: under the shell,
      # lightweight-charts never sizes its canvas bitmaps, so every geometry
      # assertion passes and the "nothing in the price gutter" assertion passes
      # BECAUSE THE GUTTER IS EMPTY. The sweep refuses to run rather than
      # report green for that reason, so installing the wrong build fails the
      # job loudly instead of quietly.
      - name: Install Chromium for the sweep
        run: npx playwright install --with-deps chromium

      - name: UI sweep
        run: npm run test:ui
