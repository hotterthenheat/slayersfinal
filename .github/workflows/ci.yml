name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # node-version-file, not a literal, so the version that decides CI is the
      # same one `nvm use` reads.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # There is still NO LINT STEP: this codebase ships no ESLint config, so
      # `npm run lint` is "Missing script" and would fail every push without
      # saying anything about the code.
      #
      # There IS a test step now. `npm test` runs the six assertion scripts
      # under scripts/ — covering the partner spec's worked fixtures, replay
      # determinism under a pinned clock, the Weigher query parser, the
      # scoring-weight tables, the landing page's claims against the code that
      # backs them, and the one font family against the four places that spell
      # it — plus a refusal to vendor a proprietary system font.
      #
      # Every assertion in weights-proof and sales-proof is mutation-verified.
      # Dropping a factor without re-normalising fails it; restoring the news
      # sleeve fails it; re-importing the news generator anywhere in src fails
      # it. So does selling an unbuilt feature without the Soon chip, linking
      # the footer at a route that only redirects, or letting the pricing page
      # claim a live feed while TopBar still renders the Sim badge — and, in
      # the other direction, shipping one of those features and forgetting to
      # take the Soon chip off.

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
