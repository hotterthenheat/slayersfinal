name: Date sweep

# The suite reads the real clock, on purpose — freezing it would make a
# date-fragile assertion invisible rather than absent. `scripts/date-sweep.mjs`
# is the other half of that decision, and until now nothing ran it, so the class
# was only ever found by a Tuesday going red for free. It has form here: 45 red
# days out of 121 when the script was written, and 8 more across 90 days on the
# run that prompted this workflow.
#
# Off the PR gate deliberately. It runs the whole suite once per sampled date,
# so it is minutes rather than seconds, and a date-fragile assertion is a
# next-week problem — worth a mail on Monday, not worth blocking a merge today.
#
# 45 days at every 3rd is 15 samples: every weekday, and a wide enough span to
# cross a market holiday, which is where the expiry walk-backs bite.

on:
  schedule:
    # 06:00 UTC Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to span'
        default: '45'
      step:
        description: 'Sample every Nth day'
        default: '3'

permissions:
  contents: read

jobs:
  sweep:
    name: Suite across simulated dates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep
        run: npm run test:dates -- "${{ inputs.days || '45' }}" "${{ inputs.step || '3' }}"
