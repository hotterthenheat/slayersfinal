<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slayer Terminal — Institutional Options GEX Analytics</title>
  <meta name="description" content="Professional-grade options order flow, market-maker hedging dynamics, and institutional liquidity tracking.">
  
  <!-- SF Pro (self-hosted variable font — the site's one and only family) -->
  <!-- Declared, so the browser stops asking for /favicon.ico on every page.
       That request 404'd on every route and put a "Failed to load resource"
       in the console of a terminal whose whole pitch is that its numbers can
       be checked — the first thing anyone opening devtools saw. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/SF-Pro.var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="bg-canvas">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
