  <!-- SF Pro — self-hosted variable font, the site's ONE family.

       Replaces a two-family Google Fonts stylesheet (Inter + JetBrains Mono).
       That link was a render-blocking request to a third party: measured in a
       sandbox that cannot reach fonts.googleapis.com, every navigation stalled
       ~13.6s before painting anything. The workaround was to load it as
       `media="print"` and promote it to `all` from the bundle — which worked,
       but left the first paint in a fallback face and the swap-in reflow with
       it, and kept two third-party hosts in the CSP.

       Self-hosting deletes the whole problem instead of managing it. The file
       ships from our own origin, so it is subject to the same cache rules as
       the bundle, there is no third-party round trip to stall on, and
       `style-src`/`font-src` in lib/securityHeaders.ts are now `'self'` alone.

       One file covers the whole range: wght is a 100-900 axis, so every
       Tailwind weight comes out of the same 256KB download rather than the
       eleven static cuts the two-family stylesheet was requesting. `preload`
       because it is needed for the first paint and is discoverable here rather
       than one hop deeper inside the CSS. -->
  <link rel="preload" href="/fonts/SF-Pro.var.woff2" as="font" type="font/woff2" crossorigin>
</head>
