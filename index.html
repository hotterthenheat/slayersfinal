  <!-- Inter — self-hosted variable font, subset in-repo, the site's ONE family.

       Replaces Apple's SF Pro, which replaced a two-family Google Fonts
       stylesheet. The Google link was a render-blocking request to a third
       party: measured in a sandbox that cannot reach fonts.googleapis.com,
       every navigation stalled ~13.6s before painting anything. Self-hosting
       deleted that whole class of problem — the file ships from our own origin,
       there is no third-party round trip to stall on, and `style-src`/`font-src`
       in lib/securityHeaders.ts are `'self'` alone.

       SF Pro then had to go for a licence reason rather than a technical one:
       Apple grants it for interface design and for apps on Apple platforms, not
       for webfont embedding on a commercial site. Inter is SIL OFL 1.1, which
       grants embedding, subsetting and commercial use outright. See the
       @font-face block in src/index.css for the measurements behind picking
       Inter over Geist and Onest, and public/fonts/OFL.txt for the licence the
       font is required to travel with.

       One file covers the whole range: `wght` is a 100-900 axis and `opsz` a
       14-32 optical-size axis, so every Tailwind weight AND both optical cuts
       come out of the same 225KB download — smaller than the 256KB file it
       replaces, despite covering 1,101 codepoints against 748. `preload`
       because it is needed for the first paint and is discoverable here rather
       than one hop deeper inside the CSS. -->
  <link rel="preload" href="/fonts/Inter.var.woff2" as="font" type="font/woff2" crossorigin>
